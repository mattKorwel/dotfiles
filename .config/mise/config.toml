[tools]
python = "latest"
go = "latest"
node = "24"
starship = "latest"
zoxide = "latest"
gh = "latest"
# gcloud removed from mise 2026-05-26.
#
# gcloud was added to mise for unified version management, but the
# mise/vfox integration runs the gcloud binary's `env_keys` hook on
# the first prompt of every new shell to discover what env vars
# gcloud needs. gcloud is a Python app whose cold-start is multi-
# second on mac (Python import graph + gatekeeper code-signing
# checks), so first-prompt was stalling 5-13s before the user could
# type. Profiling: see ~/.zshenv.d/05-mount-probe.sh commit message
# and the trace at /tmp/mise-zsh-trace.log.
#
# Alternative installs:
#   * Homebrew already has it at
#     /opt/homebrew/share/google-cloud-sdk/bin/gcloud (no shim in
#     /opt/homebrew/bin yet — symlink it if you want `gcloud` on
#     PATH unconditionally:
#       ln -s ../share/google-cloud-sdk/bin/gcloud /opt/homebrew/bin/gcloud
#   * The mise-installed copy still exists at
#     ~/.local/share/mise/installs/gcloud/566.0.0/bin/gcloud and
#     works fine when invoked directly. It's just not auto-shimmed
#     anymore.
#
# To restore: uncomment the line below and run `mise install`.
# Be aware of the 5-13s first-prompt cost it brings back.
# gcloud = "latest"
usage = "latest"
"npm:@google/gemini-cli" = "nightly"
chezmoi = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]

# Performance tuning (added 2026-05-11). The default `mise activate`
# sets up a precmd hook that runs `mise hook-env` on EVERY prompt
# to pick up per-directory `mise.toml` overrides. Profiling on mac
# (zprof in ~/.zshrc) showed this hook costs ~270ms per prompt —
# visible as keystroke/Enter sluggishness.
#
# We don't use per-directory mise.toml at all; this global config
# is the only one. So:
#   * chpwd_only=true   — skip the per-prompt scan entirely; only
#                          re-evaluate when we cd.
#   * cache_ttl=1h      — even when cd does trigger a scan, reuse
#                          a recent result for an hour. (We never
#                          edit this config interactively.)
#
# To force a refresh after editing this file: `mise hook-env`.
#
# The nested-table form `[settings.hook_env]` is required; the
# top-level `[hook_env]` form (which mise's docs sometimes show)
# is rejected by mise ≤2026.4.x with "unknown field" warnings.
[settings.hook_env]
chpwd_only = true
cache_ttl = "1h"

# NOTE on ceiling_paths: mise also walks UP the filesystem from
# CWD looking for `mise.toml` overrides. We disable that walk via
# the env var MISE_CEILING_PATHS=$HOME in zshenv.d/10-env.sh.
# `ceiling_paths` is an early-init setting — mise reads it BEFORE
# parsing this file — so it can't be set here.
